# KYRO containerised apps (sandbox only; fictional data). Layers on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d --build
# Requires apps/api, apps/web and apps/admin to exist (API-1, WEB-1, ADM-1).
name: kyro

services:
  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      KYRO_DB_URL: jdbc:postgresql://postgres:5432/kyro
      KYRO_DB_USER: kyro
      KYRO_DB_PASSWORD: kyro_local
      KYRO_S3_ENDPOINT: http://minio:9000
      # Host baked into presigned URLs; the browser reaches MinIO on the host port.
      KYRO_S3_PUBLIC_ENDPOINT: http://localhost:9000
      KYRO_S3_REGION: us-east-1
      KYRO_S3_ACCESS_KEY: kyro-minio
      KYRO_S3_SECRET_KEY: kyro-minio-secret
      KYRO_S3_DOCUMENTS_BUCKET: kyro-documents-local
      KYRO_MAIL_HOST: mailpit
      KYRO_MAIL_PORT: "1025"
      KYRO_MAIL_FROM: no-reply@kyro.local
      KYRO_WEB_BASE_URL: http://localhost:3000
      KYRO_SEED_ENABLED: "true"
      KYRO_SEED_PASSWORD: KyroLocal!2026
    ports:
      - "8080:8080"
    healthcheck:
      # The JRE image has no curl; use bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        KYRO_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    environment:
      KYRO_API_ORIGIN: http://api:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      args:
        KYRO_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    environment:
      KYRO_API_ORIGIN: http://api:8080
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
