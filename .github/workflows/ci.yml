name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Apps are built by parallel tasks; jobs that need them skip until they exist.
  detect:
    name: Detect present apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.detect.outputs.api }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          api=false
          if [ -f gradlew ] && [ -f apps/api/build.gradle.kts ]; then api=true; fi
          images=()
          if [ "$api" = true ] && [ -f infrastructure/docker/api.Dockerfile ]; then images+=('"api"'); fi
          if [ -f apps/web/package.json ] && [ -f infrastructure/docker/web.Dockerfile ]; then images+=('"web"'); fi
          if [ -f apps/admin/package.json ] && [ -f infrastructure/docker/admin.Dockerfile ]; then images+=('"admin"'); fi
          list="[$(IFS=,; echo "${images[*]}")]"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "images=$list" >> "$GITHUB_OUTPUT"
          echo "api=$api images=$list"

  contracts:
    name: Contracts (spec lint, client drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:lint
      - name: Regenerate API client
        run: pnpm gen:client
      - name: Fail if generated client drifted from the spec
        run: git diff --exit-code -- packages/api-client

  api:
    name: API (Gradle build)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Testcontainers uses the runner Docker daemon)
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            apps/api/build/reports/
            apps/api/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Migrations (Flyway against Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - name: Flyway migrate
        run: docker compose --profile tools run --rm flyway migrate
      - name: Flyway validate
        run: docker compose --profile tools run --rm flyway validate
      - name: Schema verification (verify.sql)
        run: docker compose exec -T postgres psql -U kyro -d kyro -v ON_ERROR_STOP=1 -f - < scripts/db/verify.sql
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root scripts are `pnpm -r --if-present <x>`, so packages that do not exist yet are skipped.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Image build (${{ matrix.target }})
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.target }}.Dockerfile
          push: false
          tags: kyro-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  security:
    name: Security (dependency review, secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.github/gitleaks.toml \
            --redact --no-banner --verbose
