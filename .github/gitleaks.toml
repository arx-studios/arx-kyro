# Extends the default ruleset; allowlists documented sandbox-only local credentials.
title = "KYRO gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local sandbox credentials (fictional, never used outside docker-compose)"
regexes = [
  '''kyro_local''',
  '''kyro-minio-secret''',
  '''KyroLocal!2026''',
  '''KYROLOCALDEVTOTPAAAAAAAAAAAAAAAA''',
]
paths = [
  '''(^|/)application-local\.yml$''',
  '''apps/api/src/test/resources/application-test\.yml$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
